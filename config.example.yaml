  shangshu:
    provider: deepseek
    model: deepseek-chat
    api_key: ${DEEPSEEK_API_KEY}
    temperature: 0.3
    max_tokens: 4096
  libu:
    provider: deepseek
    model: deepseek-chat
    api_key: ${DEEPSEEK_API_KEY}
    temperature: 0.1
    max_tokens: 2048
  hubu:
    provider: deepseek
    model: deepseek-chat
    api_key: ${DEEPSEEK_API_KEY}
    temperature: 0.2
