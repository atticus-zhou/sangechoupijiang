name: Public showcase pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-showcase-pages
  cancel-in-progress: true

jobs:
  publish-no-key-showcase:
    name: Publish no-key static showcase
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install public runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Export backend-free showcase
        run: python scripts/export_public_showcase.py --output dist/public-showcase --format json

      - name: Verify backend-free showcase
        run: python scripts/verify_static_public_showcase.py --format markdown --existing-dir dist/public-showcase

      - name: Run tracked secret scan
        run: python scripts/check_no_secrets.py

      - name: Check GitHub Pages configuration
        id: pages_preflight
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          output_path = os.environ["GITHUB_OUTPUT"]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pages",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          configured = "false"
          source = "not_enabled"
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  body = response.read().decode("utf-8", errors="replace")
              configured = "true"
              source = "enabled"
              print("GitHub Pages is enabled for this repository.")
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print("::warning::GitHub Pages not enabled. The no-key static package was built and verified, but no public Pages URL was deployed. In repository Settings -> Pages, set Source to GitHub Actions, then rerun this workflow.")
              else:
                  raise

          with open(output_path, "a", encoding="utf-8") as handle:
              handle.write(f"configured={configured}\n")
              handle.write(f"source={source}\n")
          PY

      - name: Configure Pages
        if: steps.pages_preflight.outputs.configured == 'true'
        id: configure_pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages_preflight.outputs.configured == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/public-showcase

      - name: Deploy to GitHub Pages
        if: steps.pages_preflight.outputs.configured == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify published Pages URL
        if: steps.pages_preflight.outputs.configured == 'true'
        run: |
          for attempt in 1 2 3 4 5; do
            echo "Checking GitHub Pages URL, attempt ${attempt}/5..."
            if python scripts/verify_public_showcase_live.py --url https://atticus-zhou.github.io/sangechoupijiang/ --format markdown --timeout 20; then
              exit 0
            fi
            sleep 15
          done
          python scripts/verify_public_showcase_live.py --url https://atticus-zhou.github.io/sangechoupijiang/ --format markdown --timeout 20

      - name: Explain Pages deployment result
        if: steps.pages_preflight.outputs.configured == 'true'
        run: |
          echo "GitHub Pages deployed and verified: ${{ steps.deployment.outputs.page_url }}"

      - name: Explain skipped Pages deployment
        if: steps.pages_preflight.outputs.configured != 'true'
        run: |
          echo "GitHub Pages not enabled; skipped deployment after building, verifying, and scanning the no-key static package."
          echo "This is not a product build failure. Enable Settings -> Pages -> Source: GitHub Actions, rerun this workflow, then verify https://atticus-zhou.github.io/sangechoupijiang/ before sharing it."
