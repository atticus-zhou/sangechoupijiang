name: Release readiness

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  no-key-release-gate:
    name: No-key public release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install public runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Run no-key release readiness audit
        run: |
          mkdir -p release-readiness-report
          python scripts/verify_release_readiness.py --format markdown | tee release-readiness-report/release-readiness.md

      - name: Run tracked secret scan
        run: python scripts/check_no_secrets.py | tee release-readiness-report/secret-scan.txt

      - name: Upload no-key release evidence
        uses: actions/upload-artifact@v4
        with:
          name: no-key-release-evidence
          path: release-readiness-report/
          if-no-files-found: error
