name: Release readiness

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  no-key-release-gate:
    name: No-key public release gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install public runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Run no-key release readiness audit
        run: python scripts/verify_release_readiness.py --format markdown

      - name: Run tracked secret scan
        run: python scripts/check_no_secrets.py
